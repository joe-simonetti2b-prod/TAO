name: Build APK TAO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.TAO_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Dépendances
        run: npm ci || npm install
      - name: Web (obfusqué) + synchronisation Android
        run: npm run sync
      - name: APK de phase test (debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Keystore (si configuré)
        if: env.KS != ''
        run: echo "$KS" | base64 -d > $RUNNER_TEMP/tao.jks && echo "TAO_KEYSTORE=$RUNNER_TEMP/tao.jks" >> $GITHUB_ENV
      - name: APK de production (release signé, minifié)
        if: env.TAO_KEYSTORE != ''
        env:
          TAO_KEYSTORE_PASSWORD: ${{ secrets.TAO_KEYSTORE_PASSWORD }}
          TAO_KEY_ALIAS: ${{ secrets.TAO_KEY_ALIAS }}
          TAO_KEY_PASSWORD: ${{ secrets.TAO_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TAO-apk-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
