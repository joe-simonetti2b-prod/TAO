name: Build APK TAO
permissions:
  contents: write
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'tools/voices/**', 'tools/voices2/**', '.github/workflows/voices.yml', '.github/workflows/voices2.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.TAO_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: java
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - id: android
        name: SDK Android (préinstallé sur le runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3 && (yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true)
      - id: keystore
        name: Keystore (si configuré)
        if: env.KS != ''
        run: echo "$KS" | base64 -d > $RUNNER_TEMP/tao.jks && echo "TAO_KEYSTORE=$RUNNER_TEMP/tao.jks" >> $GITHUB_ENV
      - id: build
        name: Build
        env:
          TAO_KEYSTORE_PASSWORD: ${{ secrets.TAO_KEYSTORE_PASSWORD }}
          TAO_KEY_ALIAS: ${{ secrets.TAO_KEY_ALIAS }}
          TAO_KEY_PASSWORD: ${{ secrets.TAO_KEY_PASSWORD }}
        run: bash tools/ci/build.sh 2>&1 | tee ci.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TAO-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
      - name: Publier l'APK de phase test (release « phase-test »)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase-test
          name: TAO – phase test (build ${{ github.run_number }})
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Statut du build (branche ci-status)
        if: always()
        run: |
          mkdir -p status
          echo "run=${{ github.run_number }} commit=${{ github.sha }} job=${{ job.status }} date=$(date -u +%FT%TZ)" > status/STATUS.txt
          echo "node=${{ steps.node.outcome }} java=${{ steps.java.outcome }} android=${{ steps.android.outcome }} keystore=${{ steps.keystore.outcome }} build=${{ steps.build.outcome }}" >> status/STATUS.txt
          tail -c 80000 ci.log > status/ci_tail.log 2>/dev/null || echo "pas de log" > status/ci_tail.log
          cd status && git init -q -b ci-status && git config user.name tao-ci && git config user.email ci@tao.local
          git add -A && git commit -qm "Statut run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-status
