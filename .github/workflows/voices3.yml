name: Voix finales (triplets retenus)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'tools/voices3/**', '.github/workflows/voices3.yml' ]
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q "piper-tts==1.2.0"
      - run: python tools/voices3/final.py 2>&1 | tee final.log
      - name: Publier sur la branche voices-final
        if: always()
        run: |
          mkdir -p tools/voices2/out3 && cp final.log tools/voices2/out3/ || true
          cd tools/voices2/out3 && git init -q -b voices-final && git config user.name tao-ci && git config user.email ci@tao.local
          git add -A && git commit -qm "Voix finales – run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" voices-final
